<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>KIRIK KALP ❤️‍🩹</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html,body{
  width:100%;
  height:100%;
  overflow:hidden;
}

body{
  background:#020204;
  color:white;
  font-family:Georgia,"Times New Roman",serif;
}

/* ANA SAHNE */
.scene{
  position:fixed;
  inset:0;
  overflow:hidden;
  background:
    radial-gradient(circle at 50% 45%,#30101b 0%,#10070c 35%,#020204 75%);
  transition:background 5s ease;
}

.scene.dark{
  background:#000;
}

/* YILDIZLAR */
.stars{
  position:absolute;
  inset:0;
  transition:opacity 5s ease;
}

.star{
  position:absolute;
  width:2px;
  height:2px;
  border-radius:50%;
  background:#fff;
  opacity:.7;
  animation:twinkle 3s infinite alternate;
}

.scene.dark .stars{
  opacity:.05;
}

/* AY */
.moon{
  position:absolute;
  top:8%;
  right:10%;
  width:75px;
  height:75px;
  border-radius:50%;
  background:#fff8fc;
  box-shadow:0 0 50px #fff6;
  transition:opacity 5s;
}

.scene.dark .moon{
  opacity:.05;
}

/* YAĞMUR */
.rain{
  position:absolute;
  inset:0;
  pointer-events:none;
  opacity:.45;
  transition:opacity 5s;
}

.scene.dark .rain{
  opacity:.12;
}

.drop{
  position:absolute;
  top:-30px;
  width:1px;
  height:35px;
  background:linear-gradient(transparent,#a9b5c7);
  transform:rotate(12deg);
  animation:rain linear infinite;
}

/* İÇERİK */
.content{
  position:absolute;
  inset:0;
  z-index:10;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:25px;
  text-align:center;
}

.inner{
  width:min(800px,95%);
}

.small{
  font-family:Arial,sans-serif;
  font-size:10px;
  letter-spacing:6px;
  color:#a9989f;
  margin-bottom:30px;
  opacity:0;
}

.title{
  font-size:clamp(38px,8vw,82px);
  font-weight:normal;
  font-style:italic;
  line-height:1.15;
  opacity:0;
}

.subtitle{
  margin-top:20px;
  font-size:clamp(17px,3vw,25px);
  color:#d7c7cd;
  line-height:1.8;
  opacity:0;
}

/* KALP */
.heart-container{
  position:relative;
  width:220px;
  height:190px;
  margin:35px auto;
  display:flex;
  justify-content:center;
  align-items:center;
}

.heart{
  position:relative;
  width:120px;
  height:120px;
  transform:rotate(-45deg);
  background:#e71950;
  filter:
    drop-shadow(0 0 15px #ff2457)
    drop-shadow(0 0 45px #ff174d66);
  animation:heartbeat 1.5s infinite;
  transition:all 2s ease;
}

.heart:before,
.heart:after{
  content:"";
  position:absolute;
  width:120px;
  height:120px;
  border-radius:50%;
  background:#e71950;
}

.heart:before{
  top:-60px;
  left:0;
}

.heart:after{
  left:60px;
  top:0;
}

/* KIRIK KALP */
.heart.broken{
  animation:none;
  transform:rotate(-45deg) scale(.9);
}

.heart.broken:before,
.heart.broken:after{
  background:#b80e3b;
}

/* ÇATLAK */
.crack{
  position:absolute;
  z-index:30;
  width:8px;
  height:145px;
  background:#080308;
  transform:rotate(20deg);
  opacity:0;
  clip-path:polygon(
    45% 0,
    70% 20%,
    48% 35%,
    78% 55%,
    45% 72%,
    65% 100%,
    30% 78%,
    48% 57%,
    20% 40%,
    45% 25%
  );
}

.heart.broken + .crack{
  opacity:1;
}

/* KALP PARÇALARI */
.fragment{
  position:fixed;
  z-index:50;
  pointer-events:none;
  font-size:22px;
  animation:fragmentFall 2.5s forwards;
}

/* YAZILAR */
.message{
  position:absolute;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
  width:min(800px,90%);
  font-size:clamp(23px,4vw,42px);
  line-height:1.7;
  font-style:italic;
}

.line{
  opacity:0;
  transform:translateY(25px);
  transition:opacity 1.2s,transform 1.2s;
}

.line.show{
  opacity:1;
  transform:none;
}

.final{
  position:absolute;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
  width:min(850px,90%);
  opacity:0;
  pointer-events:none;
}

.final.show{
  opacity:1;
  transition:opacity 2s;
}

.final-heart{
  font-size:110px;
  margin-bottom:30px;
  filter:drop-shadow(0 0 35px #ff466d);
  animation:healing 2.5s infinite;
}

.final-text{
  font-size:clamp(25px,5vw,50px);
  line-height:1.5;
  font-style:italic;
}

.final-small{
  margin-top:25px;
  font-family:Arial,sans-serif;
  color:#9e8c94;
  font-size:11px;
  letter-spacing:4px;
}

/* BUTON */
.start{
  position:absolute;
  bottom:9%;
  left:50%;
  transform:translateX(-50%);
  z-index:100;
  padding:15px 28px;
  border:1px solid #ffffff22;
  border-radius:30px;
  background:#ffffff08;
  color:#ddd;
  cursor:pointer;
  backdrop-filter:blur(10px);
  transition:.3s;
}

.start:hover{
  background:#ffffff15;
  transform:translateX(-50%) translateY(-3px);
}

.start.hidden{
  display:none;
}

/* MÜZİK */
.music{
  position:absolute;
  z-index:100;
  bottom:25px;
  right:25px;
  width:45px;
  height:45px;
  border:1px solid #ffffff22;
  border-radius:50%;
  background:#ffffff0b;
  color:white;
  cursor:pointer;
  backdrop-filter:blur(10px);
}

/* ANİMASYONLAR */
@keyframes heartbeat{
  0%,100%{transform:rotate(-45deg) scale(1)}
  50%{transform:rotate(-45deg) scale(1.08)}
}

@keyframes twinkle{
  from{opacity:.15}
  to{opacity:.9}
}

@keyframes rain{
  to{
    transform:translate(-100px,110vh) rotate(12deg);
  }
}

@keyframes fragmentFall{
  0%{
    opacity:1;
    transform:translate(0,0) rotate(0) scale(1);
  }
  100%{
    opacity:0;
    transform:
      translate(
        calc((var(--x) - 50) * 3px),
        180px
      )
      rotate(300deg)
      scale(.3);
  }
}

@keyframes healing{
  0%,100%{
    transform:scale(1);
  }
  50%{
    transform:scale(1.12);
  }
}

/* MOBİL */
@media(max-width:600px){

  .moon{
    width:50px;
    height:50px;
    right:7%;
  }

  .heart-container{
    transform:scale(.8);
    margin:15px auto;
  }

  .message{
    font-size:22px;
  }

  .final-heart{
    font-size:85px;
  }

  .start{
    bottom:10%;
  }
}
</style>
</head>

<body>

<div class="scene" id="scene">

  <div class="stars" id="stars"></div>

  <div class="moon"></div>

  <div class="rain" id="rain"></div>

  <div class="content">

    <div class="inner">

      <div class="small" id="small">
        BAZI HİKÂYELER BİTER...
      </div>

      <h1 class="title" id="title">
        KIRIK KALP
      </h1>

      <div class="heart-container" id="heartContainer">

        <div class="heart" id="heart"></div>

        <div class="crack"></div>

      </div>

      <div class="subtitle" id="subtitle">
        AMA BAZI İZLER KALIR.
      </div>

    </div>

  </div>

  <div class="message" id="message">

    <div class="line" id="line1">
      Bir zamanlar bir hikâye vardı.
    </div>

    <div class="line" id="line2">
      Güzel başladı.
    </div>

    <div class="line" id="line3">
      Çok şey yaşandı.
    </div>

    <div class="line" id="line4">
      Sonra kalp kırıldı.
    </div>

    <div class="line" id="line5">
      Ve bazı şeyler eskisi gibi olmadı.
    </div>

  </div>

  <div class="final" id="final">

    <div class="final-heart">
      ❤️‍🩹
    </div>

    <div class="final-text">
      HER ŞEY ESKİSİ GİBİ OLMAYABİLİR.<br>
      <strong>AMA BEN İYİLEŞECEĞİM.</strong>
    </div>

    <div class="final-small">
      BAZI YARALAR ZAMANLA GÜZELLEŞİR.
    </div>

  </div>

  <button class="start" id="start" onclick="startStory()">
    ❤️‍🩹 HİKÂYEYİ BAŞLAT
  </button>

  <button class="music" id="musicButton" onclick="toggleMusic()">
    🎵
  </button>

</div>

<audio id="music" preload="auto" loop>
  <source src="sarki.mp3" type="audio/mpeg">
</audio>

<script>

/* YILDIZLAR */
const stars=document.getElementById("stars");

for(let i=0;i<100;i++){

  const star=document.createElement("div");

  star.className="star";

  star.style.left=Math.random()*100+"%";
  star.style.top=Math.random()*100+"%";

  star.style.animationDelay=
    Math.random()*3+"s";

  star.style.animationDuration=
    (2+Math.random()*4)+"s";

  stars.appendChild(star);
}


/* YAĞMUR */
const rain=document.getElementById("rain");

for(let i=0;i<80;i++){

  const drop=document.createElement("div");

  drop.className="drop";

  drop.style.left=Math.random()*100+"%";

  drop.style.animationDuration=
    (.5+Math.random()*1)+"s";

  drop.style.animationDelay=
    Math.random()*2+"s";

  rain.appendChild(drop);
}


/* ELEMENTLER */
const scene=
document.getElementById("scene");

const heart=
document.getElementById("heart");

const start=
document.getElementById("start");

const music=
document.getElementById("music");

const musicButton=
document.getElementById("musicButton");


/* MÜZİK */
function toggleMusic(){

  if(music.paused){

    music.play().then(()=>{

      musicButton.textContent="⏸️";

    }).catch(()=>{

      alert(
        "Müzik bulunamadı. sarki.mp3 dosyasının index.html ile aynı klasörde olduğundan emin ol."
      );

    });

  }else{

    music.pause();

    musicButton.textContent="🎵";

  }

}


/* HİKÂYE */
function startStory(){

  start.classList.add("hidden");

  music.play().then(()=>{

    musicButton.textContent="⏸️";

  }).catch(()=>{});


  /* BAŞLANGIÇ */
  setTimeout(()=>{

    document
      .getElementById("small")
      .style.opacity="1";

  },500);


  setTimeout(()=>{

    document
      .getElementById("title")
      .style.opacity="1";

  },1200);


  setTimeout(()=>{

    document
      .getElementById("subtitle")
      .style.opacity="1";

  },1800);


  /* KALBİ KIR */
  setTimeout(()=>{

    breakHeart();

  },3000);


  /* YAZILAR */
  setTimeout(()=>{

    showLine("line1");

  },5000);

  setTimeout(()=>{

    showLine("line2");

  },6500);

  setTimeout(()=>{

    showLine("line3");

  },8000);

  setTimeout(()=>{

    showLine("line4");

  },9500);

  setTimeout(()=>{

    showLine("line5");

  },11000);


  /* KARARMA */
  setTimeout(()=>{

    scene.classList.add("dark");

  },12500);


  /* FİNAL */
  setTimeout(()=>{

    showFinal();

  },15500);

}


/* KALBİ KIR */
function breakHeart(){

  heart.classList.add("broken");

  heart.style.transform=
    "rotate(-45deg) scale(.85) translateX(-8px)";

  createFragments();

}


/* KALP PARÇALARI */
function createFragments(){

  for(let i=0;i<28;i++){

    const fragment=
      document.createElement("div");

    fragment.className="fragment";

    fragment.textContent=
      Math.random()>0.5 ? "💔" : "❤️";

    fragment.style.left=
      (50+Math.random()*12-6)+"vw";

    fragment.style.top=
      (45+Math.random()*12-6)+"vh";

    fragment.style.setProperty(
      "--x",
      Math.random()*100
    );

    fragment.style.animationDelay=
      Math.random()*.8+"s";

    document.body.appendChild(fragment);

    setTimeout(()=>{

      fragment.remove();

    },3500);

  }

}


/* YAZI GÖSTER */
function showLine(id){

  document
    .getElementById(id)
    .classList.add("show");

}


/* FİNAL */
function showFinal(){

  document
    .getElementById("message")
    .style.display="none";

  document
    .getElementById("heartContainer")
    .style.opacity="0";

  document
    .getElementById("final")
    .classList.add("show");

}


/* SAYFAYA TIKLAYINCA KÜÇÜK KALP */
document.addEventListener("click",function(e){

  if(e.target.closest("button")) return;

  const h=
    document.createElement("div");

  h.textContent=
    ["🖤","💔","❤️‍🩹","✨"][
      Math.floor(Math.random()*4)
    ];

  h.style.position="fixed";
  h.style.left=e.clientX+"px";
  h.style.top=e.clientY+"px";
  h.style.zIndex="500";
  h.style.pointerEvents="none";
  h.style.fontSize="22px";

  h.animate([

    {
      transform:"translateY(0) scale(.5)",
      opacity:0
    },

    {
      transform:"translateY(-80px) scale(1.3)",
      opacity:1
    },

    {
      transform:"translateY(-130px) scale(.7)",
      opacity:0
    }

  ],{
    duration:1200,
    easing:"ease-out"
  });

  document.body.appendChild(h);

  setTimeout(()=>{
    h.remove();
  },1200);

});

</script>

</body>
</html>
